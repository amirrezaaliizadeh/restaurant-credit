<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Credit</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2a24; --muted: #6b766f;
    --brand: #2f6b4f; --brand-ink: #ffffff; --danger: #b3412e; --line: #e4e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a17; --card: #1d2420; --ink: #eef2ee; --muted: #93a099; --brand: #5aa57f; --brand-ink: #0f1713; --danger: #e07a67; --line: #2b352f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  header { padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 20px; margin: 0; }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  input, button { font: inherit; }
  input[type=text], input[type=tel], input[type=password], input[type=search], input[type=number] {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  button { border: 0; border-radius: 10px; padding: 12px 16px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: var(--danger); color: #fff; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .customer { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .customer:first-child { border-top: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .balance { font-size: 40px; font-weight: 700; margin: 4px 0 2px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; padding: 14px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); display: none; }
  .toast.err { background: var(--danger); color: #fff; }
  .tx { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .pos { color: var(--brand); } .neg { color: var(--danger); }
  .hidden { display: none; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; }
  .check input { width: 20px; height: 20px; }
</style>
</head>
<body>
<header>
  <h1>Customer Credit</h1>
  <button class="secondary" id="logout" style="display:none">Lock</button>
</header>
<main>

  <!-- Login -->
  <section id="login" class="card">
    <label for="pin">Staff PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <label for="staffName">Your name</label>
    <input id="staffName" type="text" placeholder="e.g. Marco">
    <p style="margin-top:14px"><button id="loginBtn" style="width:100%">Unlock</button></p>
  </section>

  <!-- Search / list -->
  <section id="home" class="hidden">
    <div class="card">
      <input id="search" type="search" placeholder="Search by name or phone">
      <div id="list" style="margin-top:8px"></div>
      <p><button id="newBtn" class="secondary" style="width:100%">+ New customer</button></p>
    </div>
  </section>

  <!-- New customer -->
  <section id="newForm" class="card hidden">
    <h2 style="margin-top:0;font-size:18px">New customer</h2>
    <label for="nName">Full name</label>
    <input id="nName" type="text">
    <label for="nPhone">Mobile number (Italy +39 assumed)</label>
    <input id="nPhone" type="tel" placeholder="333 123 4567">
    <label class="check"><input id="nConsent" type="checkbox"> Customer agreed to receive balance messages</label>
    <div class="row" style="margin-top:16px">
      <button class="secondary" id="nCancel">Cancel</button>
      <button id="nSave">Save</button>
    </div>
  </section>

  <!-- Customer detail -->
  <section id="detail" class="hidden">
    <div class="card">
      <button class="secondary" id="back" style="padding:6px 12px">&larr; Back</button>
      <h2 id="dName" style="margin:12px 0 0;font-size:20px"></h2>
      <div class="muted" id="dPhone"></div>
      <div class="balance" id="dBalance"></div>
      <div class="muted" id="dConsent"></div>

      <label for="amount">Amount (€)</label>
      <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
      <label for="note">Note (optional)</label>
      <input id="note" type="text" maxlength="200" placeholder="e.g. Table 4 dinner">
      <div class="row" style="margin-top:16px">
        <button id="chargeBtn" class="danger">Deduct</button>
        <button id="topupBtn">Add credit</button>
      </div>
    </div>
    <div class="card">
      <strong>History</strong>
      <div id="history"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let pin = '', staff = '', current = null, searchTimer;

function show(id) {
  ['login', 'home', 'newForm', 'detail'].forEach((s) => $(s).classList.toggle('hidden', s !== id));
  $('logout').style.display = id === 'login' ? 'none' : '';
}
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), 4500);
}
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-staff-pin': pin, 'x-staff-name': staff },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

$('loginBtn').onclick = async () => {
  pin = $('pin').value; staff = $('staffName').value.trim() || 'staff';
  try {
    await api('/login', { method: 'POST', body: { pin } });
    sessionStorage.setItem('s', JSON.stringify({ pin, staff }));
    show('home'); loadList();
  } catch (e) { toast(e.message, true); }
};
$('pin').addEventListener('keydown', (e) => e.key === 'Enter' && $('loginBtn').click());
$('logout').onclick = () => { pin = ''; sessionStorage.clear(); show('login'); };

async function loadList() {
  const rows = await api('/customers?q=' + encodeURIComponent($('search').value));
  $('list').innerHTML = rows.length ? rows.map((c) => `
    <div class="customer" data-id="${c.id}">
      <div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.phone)}</div></div>
      <strong>${esc(c.balance)}</strong>
    </div>`).join('') : '<p class="muted">No customers found.</p>';
  document.querySelectorAll('.customer').forEach((el) => (el.onclick = () => openCustomer(el.dataset.id)));
}
$('search').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadList, 250); };

async function openCustomer(id) {
  const d = await api(`/customers/${id}/history`);
  current = d.customer;
  $('dName').textContent = current.name;
  $('dPhone').textContent = current.phone;
  $('dBalance').textContent = current.balance;
  $('dConsent').textContent = current.consent ? '✓ Balance messages enabled' : '✗ No consent for messages';
  $('amount').value = ''; $('note').value = '';
  $('history').innerHTML = d.transactions.length ? d.transactions.map((t) => `
    <div class="tx"><span>${esc(t.created_at.slice(0, 16))}<br><span class="muted">${esc(t.kind)}${t.note ? ' · ' + esc(t.note) : ''}</span></span>
    <strong class="${t.amount_cents > 0 ? 'pos' : 'neg'}">${t.amount_cents > 0 ? '+' : ''}${esc(t.amount)}</strong></div>`).join('')
    : '<p class="muted">No transactions yet.</p>';
  show('detail');
}
$('back').onclick = () => { show('home'); loadList(); };

async function move(kind) {
  const amount = $('amount').value;
  if (!amount) return toast('Enter an amount', true);
  const btns = [$('chargeBtn'), $('topupBtn')]; btns.forEach((b) => (b.disabled = true));
  try {
    const r = await api(`/customers/${current.id}/${kind}`, { method: 'POST', body: { amount, note: $('note').value } });
    const m = r.message.status;
    toast(`Done. New balance ${r.customer.balance}. Message: ${m === 'sent' ? 'sent ✓' : m === 'dry-run' ? 'test mode' : m === 'queued' ? 'will go in tonight\'s summary' : m === 'skipped' ? 'not sent' : 'FAILED'}`, m === 'failed');
    openCustomer(current.id);
  } catch (e) { toast(e.message, true); }
  btns.forEach((b) => (b.disabled = false));
}
$('topupBtn').onclick = () => move('topup');
$('chargeBtn').onclick = () => move('charge');

$('newBtn').onclick = () => { $('nName').value = $('nPhone').value = ''; $('nConsent').checked = false; show('newForm'); };
$('nCancel').onclick = () => show('home');
$('nSave').onclick = async () => {
  try {
    const c = await api('/customers', { method: 'POST', body: { name: $('nName').value, phone: $('nPhone').value, consent: $('nConsent').checked } });
    toast('Customer added'); openCustomer(c.id);
  } catch (e) { toast(e.message, true); }
};

try {
  const s = JSON.parse(sessionStorage.getItem('s') || 'null');
  if (s) { pin = s.pin; staff = s.staff; api('/customers').then(() => { show('home'); loadList(); }).catch(() => show('login')); }
} catch (_) {}
</script>
</body>
</html>
